<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only
     MRC: the phone remote. The FX layer's effects (held or latched), its four macros, the solos, the track mutes,
     the DRUM lanes' mutes, the selected track and its sound's eight EDIT values, over the editor's SysEx: F0 7D 46 4C 52 op .. F7 (firmware/src/remote.c).
     The FM-1 through Web MIDI (Android Chrome, the phone plugged in with a USB OTG cable), or the emulator in
     another tab of this site (BroadcastChannel "mrc-remote", web/emu/index.html). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="mobile-web-app-capable" content="yes">
<title>MRC Remote</title>
<style>
@font-face { font-family: "Inter Tight"; src: url("../fonts/InterTight.ttf") format("truetype"); font-weight: 100 900; }
:root {
  --ink: #0e0e0e; --bg: #141414; --surf: #1c1c1b; --raise: #262625;
  --text: #e4dcc8; --mint: #3ddc97;
  --a1: #fbe8a6; --a2: #f3ba5a; --a3: #f79b7a; --a4: #eb5560;
  --dim: rgba(228, 220, 200, .55); --faint: rgba(228, 220, 200, .28); --line: rgba(228, 220, 200, .09);
  --sans: "Inter Tight", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --gap: 8px; --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font: 600 13px/1.2 var(--sans);
  -webkit-font-smoothing: antialiased; overscroll-behavior: none; overflow: hidden; }
body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
.app { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; gap: var(--gap);
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }

/* top: the tabs and the settings */
.top { display: flex; align-items: center; gap: 6px; }
.tabs { flex: 1; display: flex; gap: 4px; background: var(--bg); border-radius: 999px; padding: 4px; }
.tab { flex: 1; height: 34px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--dim);
  transition: background .15s, color .15s; }
.tab.on { background: var(--raise); color: var(--text); }
.gear { position: relative; width: 42px; height: 42px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; flex: none; }
.gear svg { width: 19px; height: 19px; opacity: .8; }
.gear i { position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.gear i.on { background: var(--mint); box-shadow: 0 0 6px var(--mint); }
.gear i.warn { background: var(--a4); }

/* the middle: one pane at a time */
.panes { position: relative; min-height: 0; }
.pane { position: absolute; inset: 0; display: none; }
.pane.on { display: grid; }

/* PUNCH IN: 14 pads, LATCH, ALL OFF */
#p-punch { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: var(--gap); }
.pad { position: relative; border-radius: var(--r); background: var(--surf); padding: 10px; touch-action: none;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; text-align: left;
  font-weight: 800; font-size: 13px; letter-spacing: .02em; transition: background .05s, transform .05s; overflow: hidden; }
.pad small { font-size: 10px; font-weight: 600; color: var(--dim); letter-spacing: .08em; margin-top: 2px; }
.pad::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--c); opacity: .55; }
.pad::after { content: ""; position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; }
.pad.dev { box-shadow: inset 0 0 0 2px var(--c); }
.pad.act::after { background: var(--mint); box-shadow: 0 0 6px var(--mint); }
.pad.held { background: var(--c); color: var(--ink); transform: scale(.97); }
.pad.held small { color: rgba(14, 14, 14, .6); }
.pad.na { opacity: .3; }
.pad.util { background: transparent; box-shadow: inset 0 0 0 1px var(--line); justify-content: center; align-items: center;
  font-size: 11px; letter-spacing: .12em; color: var(--dim); }
.pad.util::before { display: none; }
.pad.util.on { background: var(--a2); color: var(--ink); box-shadow: none; }
.pad.util.red { color: var(--a4); }

/* EFFECTS: four faders */
#p-fx { grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
.fader { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; background: var(--surf); border-radius: var(--r); padding: 10px 10px 12px; min-height: 0; }
.fader label { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: var(--dim); text-align: center; }
.fader output { text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; }
.ftrack { position: relative; border-radius: 10px; background: var(--ink); touch-action: none; overflow: hidden; min-height: 40px; }
.ffill { position: absolute; left: 0; right: 0; background: var(--c); opacity: .9; border-radius: 0; }
.ftrack.bi::before { content: ""; position: absolute; top: 50%; left: 6px; right: 6px; height: 1px; background: var(--faint); }

/* DRUMS: the lanes of every DRUM track */
#p-drums { grid-auto-rows: 1fr; gap: var(--gap); }
.lset { display: grid; grid-template-rows: auto 1fr; gap: 4px; min-height: 0; }
.lset > span { font-size: 10px; letter-spacing: .14em; color: var(--dim); font-weight: 800; padding-left: 2px; }
.lanes { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: var(--gap); min-height: 0; }
.lane { border-radius: var(--r); background: var(--c); color: var(--ink); font-weight: 800; font-size: 12px; letter-spacing: .06em; touch-action: none; }
.lane.off { background: var(--surf); color: var(--faint); text-decoration: line-through; }
.empty { place-self: center; color: var(--dim); text-align: center; font-size: 13px; line-height: 1.5; }

/* EDIT: the selected track's eight EDIT values */
#p-edit { grid-template-rows: auto 1fr; gap: var(--gap); }
.ehead { display: flex; align-items: baseline; gap: 8px; padding: 0 2px; font-size: 12px; }
.ehead b { font-weight: 800; color: var(--a2); }
.ehead span { color: var(--dim); font-size: 10px; letter-spacing: .12em; font-weight: 800; }
.egrid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: var(--gap); min-height: 0; }
.egrid .fader { padding: 8px 6px 10px; gap: 6px; }
.egrid .fader label, .egrid .fader output { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.egrid .fader output { font-size: 12px; }
.fader.na { opacity: .25; pointer-events: none; }

/* bottom: the four tracks' SELECT, SOLO and MUTE */
.tracks { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
/* upright: a column per track, MUTE above SOLO, both tall for the thumb */
.trk { background: var(--bg); border-radius: var(--r); padding: 6px; display: grid; grid-template-columns: 1fr; gap: 6px; }
.trk .nm { order: 0; }
.trk .sel { order: 1; }
.trk .mute { order: 2; }
.trk .solo { order: 3; }
.trk .nm { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 1px 3px 0; font-size: 11px; }
.trk .nm b { font-weight: 800; }
.trk .nm span { color: var(--dim); font-size: 9px; letter-spacing: .08em; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trk.silent .nm { opacity: .4; }
.trk.soloed-out .tb:not(.sel) { opacity: .3; }        /* another track soloed: this one is not heard (SELECT stays) */
.tb { height: 58px; border-radius: 10px; background: var(--surf); font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--dim); touch-action: none; }
.tb.solo.on { background: var(--mint); color: var(--ink); }
.tb.solo.dev { box-shadow: inset 0 0 0 2px var(--mint); color: var(--mint); }
/* the sound button: lit while the track sounds, dark (crossed speaker) while it is muted */
.tb.mute { display: grid; place-items: center; }
.tb.mute svg { width: 22px; height: 22px; }
.tb.mute .x { display: none; }
.tb.mute.off .x { display: inline; }
.tb.mute.off .w { display: none; }
.tb.mute.on { background: var(--mint); color: var(--ink); }
.tb.sel { height: 48px; }
.tb.sel.on { background: var(--a1); color: var(--ink); }
.tb.na { opacity: .3; }

/* settings: a sheet over everything */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none; align-items: flex-end; justify-content: center; z-index: 9; }
.scrim.on { display: flex; }
.sheet { width: min(520px, 100%); max-height: 100dvh; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 20px 18px max(20px, env(safe-area-inset-bottom));
  display: grid; gap: 12px; animation: up .2s cubic-bezier(.2, .8, .2, 1); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: .04em; display: flex; justify-content: space-between; align-items: center; }
.sheet h2 button { font-size: 22px; line-height: 1; color: var(--dim); width: 36px; height: 36px; }
.stat { display: flex; align-items: center; gap: 9px; color: var(--dim); }
.stat i { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.stat i.on { background: var(--mint); box-shadow: 0 0 6px var(--mint); }
.stat i.warn { background: var(--a4); }
.opt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; background: var(--surf); border-radius: var(--r); padding: 14px; text-align: left; width: 100%; }
.opt b { font-size: 14px; }
.opt span { grid-column: 1; color: var(--dim); font-weight: 500; font-size: 12px; line-height: 1.4; }
.opt em { grid-row: 1 / 3; grid-column: 2; font-style: normal; font-size: 11px; letter-spacing: .1em; color: var(--dim); }
.opt.on { box-shadow: inset 0 0 0 2px var(--a2); }
.opt.on em { color: var(--a2); }
.msg { color: var(--a3); font-weight: 500; font-size: 12px; line-height: 1.5; margin: 0; }
.msg:empty { display: none; }
.msg b { color: var(--text); }
.msg a, .foot a { color: var(--a2); }
.foot { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; font-weight: 500; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px; color: var(--dim); }
.sw { width: 44px; height: 26px; border-radius: 999px; background: var(--raise); position: relative; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--dim); transition: left .15s; }
.sw.on { background: var(--a2); }
.sw.on::after { left: 21px; background: var(--ink); }

/* a phone on its side: the pads in two rows, the lanes in one */
@media (orientation: landscape) {
  :root { --gap: 6px; --r: 12px; }
  .app { gap: 6px; }
  .tab { height: 30px; }
  .gear { width: 38px; height: 38px; }
  #p-punch { grid-template-columns: repeat(8, 1fr); }
  .egrid { grid-template-columns: repeat(8, 1fr); }
  .lanes { grid-template-columns: repeat(8, 1fr); }
  .trk { grid-template-columns: auto 1fr 1fr; align-items: center; padding: 5px; row-gap: 5px; }
  .trk .nm { grid-column: 1; grid-row: 1 / 3; flex-direction: column; align-items: flex-start; gap: 1px; padding: 0 4px; min-width: 0; max-width: 64px; }
  .tb { height: 46px; }
  .trk .sel { grid-column: 2 / 4; height: 36px; }   /* sideways: SELECT over MUTE and SOLO, side by side */
  .trk .solo { order: 3; }
  .trk .mute { order: 2; }
  .pad { padding: 8px; font-size: 12px; }
}
@media (orientation: landscape) and (max-height: 360px) {
  .tb { height: 40px; }
  .trk .sel { height: 30px; }
  .pad small { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="tabs" role="tablist">
      <button class="tab on" data-p="punch">PUNCH IN</button>
      <button class="tab" data-p="fx">EFFECTS</button>
      <button class="tab" data-p="drums">DRUMS</button>
      <button class="tab" data-p="edit">EDIT</button>
    </div>
    <button class="gear" id="gear" aria-label="Settings"><i id="dot"></i>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div class="panes">
    <div class="pane on" id="p-punch"></div>
    <div class="pane" id="p-fx"></div>
    <div class="pane" id="p-drums"></div>
    <div class="pane" id="p-edit"><div class="ehead" id="ehead"></div><div class="egrid" id="egrid"></div></div>
  </div>

  <div class="tracks" id="tracks"></div>
</div>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h2 id="sh-t">Settings <button id="close" aria-label="Close">×</button></h2>
    <div class="stat"><i id="sdot"></i><span id="status">Not connected</span></div>
    <button class="opt" id="connect"><b>FM-1 over USB</b><span>Plug the phone into the FM-1's USB-C with an OTG cable.</span><em>CONNECT</em></button>
    <button class="opt" id="emu"><b>Emulator</b><span>The emulator open in another tab of this site.</span><em>CONNECT</em></button>
    <p class="msg" id="msg"></p>
    <div class="row"><span>Vibrate on touch</span><button class="sw on" id="haptic" aria-label="Vibrate on touch"></button></div>
  </div>
</div>

<script>
"use strict";
/* the effects, in perform.c's order (PF_R8 .. PF_ETHR; append-only, the firmware's numbers) */
const FX = [
  ["REPEAT", "1/8"], ["REPEAT", "1/16"], ["REPEAT", "1/32"], ["REVERSE", "1/8"], ["LPF", "SWEEP"], ["HPF", "SWEEP"],
  ["TAPE", "STOP"], ["FREEZE", "GRAIN"], ["OCT", "UP"], ["OCT", "DOWN"], ["FLANGER", "SWEEP"], ["PHASER", "SWEEP"],
  ["REV", "THROW"], ["ECHO", "THROW"],
];
const ACC = ["var(--a1)", "var(--a2)", "var(--a3)", "var(--a4)"];
/* engines.c ENGINES order */
const ENG = ["ANALOG", "DIGITAL", "PHASE", "LOFI", "SAMPLE", "VOICE", "TRIO", "WHEEL", "GRAIN", "PHYS", "DRUM", "NOISE",
  "FM6", "SLICE", "ADPCM"];
const LANES = ["KICK", "SNARE", "CLAP", "HATCL", "HATOP", "TOM", "RIM", "BELL"];
const MAC = [
  { name: "FILTER", min: -100, max: 100, bi: true, c: "var(--a1)" },
  { name: "CRUSH", min: 0, max: 100, c: "var(--a2)" },
  { name: "THROW", min: 0, max: 100, c: "var(--a3)" },
  { name: "DEPTH", min: 0, max: 100, c: "var(--a4)", inv: true },   /* perf_k[3] is a cut: DEPTH = 100 - it */
];
const HDR = [0xF0, 0x7D, 0x46, 0x4C, 82];
const $ = (id) => document.getElementById(id);
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) { return null; } };

let haptic = ls("mrc-remote-haptic") !== "0";
const buzz = (ms) => { if (haptic && navigator.vibrate) navigator.vibrate(ms); };
const press = (el, fn) => el.addEventListener("pointerdown", (ev) => { ev.preventDefault(); fn(ev); });

/* ------------------------------------------------------------ settings sheet --- */
const sheet = (on) => $("scrim").classList.toggle("on", on);
$("gear").onclick = () => sheet(true);
$("close").onclick = () => sheet(false);
$("scrim").addEventListener("click", (e) => { if (e.target === $("scrim")) sheet(false); });
$("haptic").classList.toggle("on", haptic);
$("haptic").onclick = () => { haptic = !haptic; ls("mrc-remote-haptic", haptic ? "1" : "0"); $("haptic").classList.toggle("on", haptic); };

/* ------------------------------------------------------------ tabs --- */
function showTab(p) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.p === p));
  document.querySelectorAll(".pane").forEach((x) => x.classList.toggle("on", x.id === "p-" + p));
  ls("mrc-remote-tab", p);
}
document.querySelectorAll(".tab").forEach((t) => { t.onclick = () => showTab(t.dataset.p); });
showTab(ls("mrc-remote-tab") || "punch");

/* ------------------------------------------------------------ transport --- */
let link = null;             /* { kind, send(bytes), close() } */
let lastReply = 0, pollTimer = 0;
let st = null;               /* the device's state, the last reply */
let names = {};              /* track -> lane names (op 7) */
let namesAsked = 0;
let edesc = null;            /* the selected track's EDIT values: [{ label, min, max }] (op 10) */
const pendingNames = [];

function frame(op, ...args) { return [...HDR, op, ...args.map((v) => v & 127), 0xF7]; }
function send(op, ...args) { if (link) link.send(frame(op, ...args)); }
function v14(v) { const u = Math.max(0, Math.min(16383, v + 8192)); return [u & 127, u >> 7]; }

function say(text, cls) {
  $("status").textContent = text;
  $("dot").className = $("sdot").className = cls || "";
}
function msg(html) { $("msg").innerHTML = html || ""; }

function onReply(d) {
  if (!d || d.length < 8) return;
  for (let i = 0; i < 5; i++) if (d[i] !== HDR[i]) return;
  if (!lastReply) say(link && link.kind === "emu" ? "Connected to the emulator" : "Connected to the FM-1", "on");
  lastReply = performance.now();
  const r = d.slice(5, d.length - 1);
  let i = 0;
  const b = () => r[i++] | 0, w = () => { const lo = b(); return lo | b() << 7; };
  const s = { op: b(), rc: b(), ntrk: b(), nfx: b() };
  s.rmt = w(); s.dev = w(); s.act = w(); s.avail = w();
  s.k = [0, 1, 2, 3].map(() => w() - 8192);
  s.rsolo = b(); s.solo = b(); s.playing = b(); s.kill = b();
  s.trk = [];
  for (let t = 0; t < s.ntrk; t++) {
    const eng = b(), fl = b(), lo = b(), hi = b();
    s.trk.push({ eng, mute: !!(fl & 1), drum: !!(fl & 2), lanes: lo | hi << 7 });
  }
  if (s.op === 7 && !s.rc) {
    const t = pendingNames.shift();
    const list = [];
    for (let l = 0; l < 8; l++) { let n = ""; while (i < r.length && r[i]) n += String.fromCharCode(r[i++]); i++; list.push(n); }
    if (t !== undefined) names[t] = list;
  }
  /* the sound block (op 8..10's firmware; none from an older one): the selected track, its EDIT values */
  const str = () => { let n = ""; while (i < r.length && r[i]) n += String.fromCharCode(r[i++]); i++; return n; };
  if (i + 2 <= r.length) {
    s.sel = b(); s.seng = b();
    s.ev = []; s.et = [];
    for (let k = 0; k < 8; k++) { s.ev.push(w() - 8192); s.et.push(str()); }
    if (s.op === 10 && !s.rc && i < r.length) {
      const d = [];
      for (let k = 0; k < 8; k++) { const label = str(), min = w() - 8192, max = w() - 8192; d.push({ label, min, max }); }
      edesc = d;
    }
  }
  st = s;
  render();
}

function poll() {
  if (!link) return;
  const now = performance.now();
  if (lastReply && now - lastReply > 1200)
    say(link.kind === "emu" ? "The emulator is not answering" : "The FM-1 is not answering", "warn");
  else if (lastReply) say(link.kind === "emu" ? "Connected to the emulator" : "Connected to the FM-1", "on");
  send(10);                                     /* the query, with the EDIT values' labels and ranges */
  if (st && now - namesAsked > 3000) {          /* the KIT can change the lanes' names */
    namesAsked = now;
    st.trk.forEach((t, k) => { if (t.drum) { pendingNames.push(k); send(7, k); } });
  }
}
function start(l) {
  if (link) link.close();
  link = l; lastReply = 0; st = null; names = {}; namesAsked = 0; pendingNames.length = 0; edesc = null;
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, 250);
  $("connect").classList.toggle("on", l.kind === "usb");
  $("emu").classList.toggle("on", l.kind === "emu");
  $("connect").querySelector("em").textContent = l.kind === "usb" ? "ON" : "CONNECT";
  $("emu").querySelector("em").textContent = l.kind === "emu" ? "ON" : "CONNECT";
  say("Connecting…");
  poll();
}

async function connectUsb() {
  msg("");
  if (!navigator.requestMIDIAccess) {
    msg("This browser has no Web MIDI. On Android use <b>Chrome</b>; iPhone browsers do not have it.");
    return;
  }
  let access;
  try { access = await navigator.requestMIDIAccess({ sysex: true }); }
  catch (e) { msg("MIDI access was refused. Allow <b>MIDI devices</b> for this site in Chrome's site settings."); return; }
  const ok = (p) => /felucca|fm-?1|mrc/i.test(p.name || "") && p.state !== "disconnected";
  const input = [...access.inputs.values()].find(ok), output = [...access.outputs.values()].find(ok);
  if (!input || !output) {
    msg("No FM-1 found. Plug the phone into the FM-1's <b>USB-C</b> with a <b>USB OTG</b> cable or adapter, switch the FM-1 on, then connect again.");
    return;
  }
  input.onmidimessage = (e) => { if (e.data[0] === 0xF0) onReply(Array.from(e.data)); };
  access.onstatechange = (e) => { if (e.port === input && e.port.state === "disconnected") say("The FM-1 was unplugged", "warn"); };
  start({ kind: "usb", send: (d) => { try { output.send(d); } catch (_) { /* unplugged */ } },
    close: () => { input.onmidimessage = null; } });
  ls("mrc-remote-link", "usb");
  setTimeout(() => { if (lastReply) sheet(false); }, 600);
}

function connectEmu() {
  msg("");
  if (typeof BroadcastChannel !== "function") { msg("This browser cannot talk to the emulator tab."); return; }
  const bus = new BroadcastChannel("mrc-remote");
  bus.onmessage = (e) => { if (e.data && Array.isArray(e.data.r)) onReply(e.data.r); };
  start({ kind: "emu", send: (d) => bus.postMessage({ q: d }), close: () => bus.close() });
  ls("mrc-remote-link", "emu");
  setTimeout(() => {
    if (link && link.kind === "emu" && !lastReply)
      msg("Open the <a href=\"../#emulator\" target=\"_blank\">emulator</a> in another tab and switch it on; this page talks to it there.");
    else if (lastReply) sheet(false);
  }, 1500);
}
$("connect").onclick = connectUsb;
$("emu").onclick = connectEmu;

/* ------------------------------------------------------------ PUNCH IN --- */
let latch = false;
const held = new Map();      /* pointerId -> fx (hold mode) */
const latched = new Set();   /* fx latched by this page */
const pads = FX.map(([a, b], e) => {
  const p = document.createElement("button");
  p.className = "pad";
  p.style.setProperty("--c", ACC[Math.floor(e / 4) % 4]);
  p.innerHTML = `<span>${a}</span><small>${b}</small>`;
  p.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    if (latch) {
      if (latched.has(e)) { latched.delete(e); send(1, e, 0); } else { latched.add(e); send(1, e, 1); }
    } else {
      p.setPointerCapture(ev.pointerId);
      held.set(ev.pointerId, e);
      send(1, e, 1);
    }
    buzz(8);
    paintPads();
  });
  const up = (ev) => {
    if (!held.has(ev.pointerId)) return;
    const f = held.get(ev.pointerId);
    held.delete(ev.pointerId);
    if (![...held.values()].includes(f)) send(1, f, 0);
    paintPads();
  };
  p.addEventListener("pointerup", up);
  p.addEventListener("pointercancel", up);
  p.addEventListener("lostpointercapture", up);
  p.addEventListener("contextmenu", (ev) => ev.preventDefault());
  $("p-punch").appendChild(p);
  return p;
});
const latchBtn = document.createElement("button");
latchBtn.className = "pad util";
latchBtn.textContent = "LATCH";
press(latchBtn, () => {
  latch = !latch;
  latchBtn.classList.toggle("on", latch);
  if (!latch) { latched.forEach((e) => send(1, e, 0)); latched.clear(); }
  buzz(6);
  paintPads();
});
const offBtn = document.createElement("button");
offBtn.className = "pad util red";
offBtn.textContent = "ALL OFF";
press(offBtn, () => { latched.clear(); held.clear(); send(6); buzz(20); paintPads(); });
$("p-punch").append(latchBtn, offBtn);
function mine(e) { return latched.has(e) || [...held.values()].includes(e); }
function paintPads() {
  const s = st;
  pads.forEach((p, e) => {
    p.classList.toggle("held", mine(e) || !!(s && (s.rmt >> e) & 1));
    p.classList.toggle("dev", !!(s && (s.dev >> e) & 1));
    p.classList.toggle("act", !!(s && (s.act >> e) & 1));
    p.classList.toggle("na", !!(s && !((s.avail >> e) & 1)));
  });
}

/* ------------------------------------------------------------ EFFECTS (the macros) --- */
const macVal = [0, 0, 0, 100];        /* as shown: FILTER -100..100, the others 0..100 (DEPTH = 100 - the cut) */
let macDrag = -1;
const macEls = MAC.map((m, k) => {
  const f = document.createElement("div");
  f.className = "fader";
  f.innerHTML = `<label>${m.name}</label><div class="ftrack${m.bi ? " bi" : ""}"><div class="ffill"></div></div><output></output>`;
  const tr = f.querySelector(".ftrack"), fill = f.querySelector(".ffill");
  fill.style.setProperty("--c", m.c);
  let lastSent = 0, timer = 0, lastTap = 0;
  const push = () => { lastSent = performance.now(); send(2, k, ...v14(m.inv ? 100 - macVal[k] : macVal[k])); };
  const set = (ev) => {
    const rc = tr.getBoundingClientRect();
    const y = Math.max(0, Math.min(1, (rc.bottom - ev.clientY) / rc.height));
    macVal[k] = Math.round(m.min + y * (m.max - m.min));
    if (m.bi && Math.abs(macVal[k]) < 4) macVal[k] = 0;   /* a detent at the centre */
    clearTimeout(timer);
    if (performance.now() - lastSent > 30) push(); else timer = setTimeout(push, 30);
    paintMacros();
  };
  tr.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    const now = performance.now();
    if (now - lastTap < 300) {                           /* double tap: back to rest */
      macVal[k] = m.inv ? 100 : 0; push(); paintMacros(); buzz(10); lastTap = 0; return;
    }
    lastTap = now;
    tr.setPointerCapture(ev.pointerId); macDrag = k; set(ev);
  });
  tr.addEventListener("pointermove", (ev) => { if (macDrag === k) set(ev); });
  const end = () => { if (macDrag === k) macDrag = -1; };
  tr.addEventListener("pointerup", end);
  tr.addEventListener("pointercancel", end);
  $("p-fx").appendChild(f);
  return { fill, out: f.querySelector("output") };
});
function paintMacros() {
  MAC.forEach((m, k) => {
    const v = macVal[k], el = macEls[k];
    if (m.bi) {
      const a = 50 + Math.max(0, v) / 2, b = 50 + Math.min(0, v) / 2;   /* up: HP, down: LP */
      el.fill.style.bottom = b + "%"; el.fill.style.top = (100 - a) + "%";
      el.out.textContent = v < 0 ? "LP " + -v : v > 0 ? "HP " + v : "OFF";
    } else {
      el.fill.style.top = (100 - v) + "%"; el.fill.style.bottom = "0";
      el.out.textContent = m.inv ? v + "%" : v ? v + "%" : "OFF";
    }
  });
}

/* ------------------------------------------------------------ DRUMS --- */
let drumKey = "";
function paintDrums() {
  const s = st;
  const drums = s ? s.trk.map((t, k) => (t.drum ? k : -1)).filter((k) => k >= 0) : [];
  const key = drums.join(",");
  const pane = $("p-drums");
  if (key !== drumKey || !pane.firstChild) {
    drumKey = key;
    pane.innerHTML = "";
    if (!drums.length) {
      pane.innerHTML = `<div class="empty">${s ? "No DRUM track.<br>Put the DRUM engine on a track to mute its lanes here." : "Not connected.<br>Tap ⚙ to connect."}</div>`;
      return;
    }
    drums.forEach((t) => {
      const set = document.createElement("div");
      set.className = "lset";
      set.innerHTML = (drums.length > 1 ? `<span>TRACK ${t + 1}</span>` : "") + `<div class="lanes"></div>`;
      if (drums.length === 1) set.style.gridTemplateRows = "1fr";
      const g = set.querySelector(".lanes");
      for (let l = 0; l < 8; l++) {
        const b = document.createElement("button");
        b.className = "lane";
        b.style.setProperty("--c", ACC[l % 4]);          /* (the colours of EDIT's faders) */
        b.dataset.t = t; b.dataset.l = l;
        press(b, () => { if (st) send(5, t, l, (st.trk[t].lanes >> l) & 1 ? 0 : 1); buzz(6); });
        g.appendChild(b);
      }
      pane.appendChild(set);
    });
  }
  pane.querySelectorAll(".lane").forEach((b) => {
    const t = +b.dataset.t, l = +b.dataset.l, nm = names[t] || LANES;
    b.textContent = nm[l] || LANES[l];
    b.classList.toggle("off", !!((s.trk[t].lanes >> l) & 1));
  });
}

/* ------------------------------------------------------------ EDIT (the selected track's sound) --- */
const edVal = [0, 0, 0, 0, 0, 0, 0, 0];
let edDrag = -1;
const edEls = [];
for (let k = 0; k < 8; k++) {
  const f = document.createElement("div");
  f.className = "fader";
  f.innerHTML = `<label>—</label><div class="ftrack"><div class="ffill"></div></div><output></output>`;
  const tr = f.querySelector(".ftrack"), fill = f.querySelector(".ffill");
  fill.style.setProperty("--c", ACC[k % 4]);
  let lastSent = 0, timer = 0;
  const push = () => { lastSent = performance.now(); send(9, k, ...v14(edVal[k])); };
  const set = (ev) => {
    const d = edesc && edesc[k];
    if (!d) return;
    const rc = tr.getBoundingClientRect();
    const y = Math.max(0, Math.min(1, (rc.bottom - ev.clientY) / rc.height));
    const v = Math.round(d.min + y * (d.max - d.min));
    if (v === edVal[k]) return;
    edVal[k] = v;
    clearTimeout(timer);
    if (performance.now() - lastSent > 30) push(); else timer = setTimeout(push, 30);
    paintEdit();
  };
  tr.addEventListener("pointerdown", (ev) => { ev.preventDefault(); tr.setPointerCapture(ev.pointerId); edDrag = k; buzz(4); set(ev); });
  tr.addEventListener("pointermove", (ev) => { if (edDrag === k) set(ev); });
  const end = () => { if (edDrag === k) edDrag = -1; };
  tr.addEventListener("pointerup", end);
  tr.addEventListener("pointercancel", end);
  $("egrid").appendChild(f);
  edEls.push({ f, tr, fill, label: f.querySelector("label"), out: f.querySelector("output") });
}
function paintEdit() {
  const s = st, ok = !!(s && s.ev && edesc);
  $("ehead").innerHTML = !s ? `<span>NOT CONNECTED · TAP ⚙ TO CONNECT</span>`
    : !s.ev ? `<span>THIS FIRMWARE HAS NO REMOTE EDIT</span>`
    : `<b>TRACK ${s.sel + 1}</b><span>${ENG[s.seng] || "ENG " + s.seng}</span>`;
  edEls.forEach((el, k) => {
    const d = ok ? edesc[k] : null, live = !!(d && d.label && d.max > d.min);
    el.f.classList.toggle("na", !live);
    el.label.textContent = live ? d.label : "—";
    el.out.textContent = live ? s.et[k] : "";
    el.tr.classList.toggle("bi", live && d.min < 0);
    if (!live) { el.fill.style.top = "100%"; el.fill.style.bottom = "0"; return; }
    const pos = (v) => ((Math.max(d.min, Math.min(d.max, v)) - d.min) / (d.max - d.min)) * 100;
    if (d.min < 0) {                                  /* bipolar: from the centre */
      const z = pos(0), p = pos(edVal[k]);
      el.fill.style.bottom = Math.min(z, p) + "%"; el.fill.style.top = (100 - Math.max(z, p)) + "%";
    } else {
      el.fill.style.top = (100 - pos(edVal[k])) + "%"; el.fill.style.bottom = "0";
    }
  });
}

/* ------------------------------------------------------------ tracks --- */
const trkEls = [];
/* the sound button's speaker: waves while the track sounds, a cross while it is muted */
const SPK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">` +
  `<path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/>` +
  `<path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>` +
  `<path class="x" d="m16 9 6 6m0-6-6 6"/></svg>`;
for (let t = 0; t < 4; t++) {
  const row = document.createElement("div");
  row.className = "trk";
  row.innerHTML = `<div class="nm"><b>T${t + 1}</b><span>—</span></div><button class="tb sel">SELECT</button><button class="tb solo">SOLO</button><button class="tb mute" aria-label="Sound on / muted">${SPK}</button>`;
  const solo = row.querySelector(".solo"), mute = row.querySelector(".mute"), sel = row.querySelector(".sel");
  press(sel, () => { if (st && st.ev && st.sel !== t) { send(8, t); edesc = null; } buzz(6); });
  press(solo, () => { if (st) send(3, t, (st.rsolo >> t) & 1 ? 0 : 1); buzz(6); });
  press(mute, () => { if (st) send(4, t, st.trk[t].mute ? 0 : 1); buzz(6); });
  $("tracks").appendChild(row);
  trkEls.push({ row, eng: row.querySelector(".nm span"), solo, mute, sel });
}

/* ------------------------------------------------------------ paint --- */
function render() {
  const s = st;
  paintPads();
  /* the macros follow the device, unless a finger is on one (the FX knobs move them too) */
  s.k.forEach((v, k) => { if (macDrag !== k) macVal[k] = MAC[k].inv ? 100 - v : v; });
  paintMacros();
  const anySolo = s.rsolo | s.solo;
  s.trk.slice(0, 4).forEach((tr, t) => {
    const el = trkEls[t];
    el.eng.textContent = ENG[tr.eng] || "ENG " + tr.eng;
    el.solo.classList.toggle("on", !!((s.rsolo >> t) & 1));
    el.solo.classList.toggle("dev", !!((s.solo >> t) & 1) && !((s.rsolo >> t) & 1));
    el.mute.classList.toggle("on", !tr.mute);         /* lit: the track sounds */
    el.mute.classList.toggle("off", tr.mute);
    el.sel.classList.toggle("on", !!s.ev && s.sel === t);
    el.sel.classList.toggle("na", !s.ev);
    el.row.classList.toggle("silent", tr.mute || (anySolo && !((anySolo >> t) & 1)));
    el.row.classList.toggle("soloed-out", !!anySolo && !((anySolo >> t) & 1));
  });
  paintDrums();
  /* the EDIT values follow the device, unless a finger is on one */
  if (s.ev) s.ev.forEach((v, k) => { if (edDrag !== k) edVal[k] = v; });
  paintEdit();
}
paintMacros();
paintDrums();
paintEdit();

/* a page hidden or closed lets go of what it holds (the FM-1 also does after 1.5 s without a request) */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && link) { held.forEach((e) => send(1, e, 0)); held.clear(); paintPads(); }
});
window.addEventListener("pagehide", () => { if (link) send(6); });

/* start: the emulator served next to it (localhost), or the link used last; else the settings */
if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || ls("mrc-remote-link") === "emu") connectEmu();
else if (ls("mrc-remote-link") === "usb" && navigator.requestMIDIAccess) connectUsb().then(() => { if (!link) sheet(true); });
else {
  sheet(true);
  if (!navigator.requestMIDIAccess) msg("This browser has no Web MIDI. On Android use <b>Chrome</b>; iPhone browsers do not have it.");
}
</script>
</body>
</html>
